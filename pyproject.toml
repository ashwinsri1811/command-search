[project]
name = "cmdmenu"
version = "0.1.0"
description = "A CLI tool to search and paste terminal commands"
authors = [{ name = "Ashwin Srivastav" }]
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "prompt_toolkit"
]

[project.scripts]
cmdmenu = "cmdmenu.__main__:main"

[tool.setuptools]
packages = ["cmdmenu"]
